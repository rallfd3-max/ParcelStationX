# Copy this file to application.properties or configure the equivalent environment variables.
db.url=jdbc:mysql://localhost:3306/parcel_station_x?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
db.username=root
db.password=CHANGE_ME

# MaiMaiYa is the V2.2 OpenAI-compatible provider. The portal is not the API endpoint.
ai.enabled=false
ai.provider=maimaiya
ai.portal-url=https://maimaiya.click/profile
ai.base-url=
ai.api-key=
ai.model=
ai.chat-path=/v1/chat/completions
ai.timeout-seconds=15
ai.max-output-tokens=1200

# Course build uses a clearly labelled mock SMS gateway.
notification.sms-mode=mock
notification.overdue-days=7,10,15
notification.scan-minutes=60
notification.max-retries=3
